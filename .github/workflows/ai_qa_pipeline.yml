name: AI QA Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run it manually from GitHub tab

jobs:
  run-ai-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps

      - name: Run Pytest & AI Triage Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pytest -v -s

      - name: Upload AI QA Reports & Dashboard
        if: always() # Runs even if tests fail, ensuring reports are saved
        uses: actions/upload-artifact@v4
        with:
          name: ai-qa-audit-logs
          path: |
            reports/
            qa_summary.md
            latest_bug_report.json